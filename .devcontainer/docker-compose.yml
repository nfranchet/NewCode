
services:
  devcontainer:
    build:
      context: .
      dockerfile: "./vscode/Dockerfile"
    volumes:
      - .:/workspaces/NewCode
      - cargo-cache-newcode:/usr/local/cargo:rw
    # Repair ownership on existing cache volumes after root-owned build installs.
    command: ["sh", "-c", "chown -R vscode:rustlang /usr/local/cargo && exec sleep infinity"]


volumes:
  cargo-cache-newcode:
