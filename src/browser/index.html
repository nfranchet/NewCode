<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Focus Editor</title>
  <link rel="stylesheet" href="/browser.css">
  <script type="module" src="/client.js"></script>
</head>
<body>
  <header><span>Focus Editor <span id="connection">Connecting…</span></span><button id="quit">Close editor</button></header>
  <main><canvas id="editor" tabindex="0" aria-label="Focus Editor workspace"></canvas></main>
  <textarea id="input" aria-label="Editor text input" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
  <section id="notice" role="status"><p id="message">Connecting to your local editor…</p><button id="reconnect" hidden>Reconnect</button><a id="external" target="_blank" rel="noopener noreferrer" hidden>Open link</a></section>
</body>
</html>
