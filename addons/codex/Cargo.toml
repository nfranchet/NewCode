[package]
name = "focus-addon-codex"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
[dependencies]
egui = { version = "=0.36.2", features = ["serde"] }
focus-addon-support = { path = "../../crates/addon-support" }
focus-addon-sdk = { path = "../../crates/addon-sdk" }
serde_json = "1"
log = "0.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
[target.'cfg(unix)'.dependencies]
libc = "0.2"
