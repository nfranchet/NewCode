name: Release binaries

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.id }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event.release.tag_name }}

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Install Linux build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev \
            libxcursor-dev libxi-dev libxrandr-dev zsh fonts-dejavu-core
      - name: Install stable Rust
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          rustup target add "$TARGET"
      - name: Install pinned Zig toolchain for Ghostty
        run: |
          python3 scripts/install-zig.py "$RUNNER_TEMP/focus-zig"
          echo "$RUNNER_TEMP/focus-zig" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          key: release-${{ matrix.target }}
      - name: Check formatting and run tests
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python3 -m unittest discover -s scripts/release -p 'test_*.py'
          cargo fmt --check
          cargo test --locked --target "$TARGET"
      - name: Build optimized executable
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET"
      - name: Package and verify
        env:
          TARGET: ${{ matrix.target }}
        run: python3 scripts/release/package.py "$TARGET" "$RELEASE_TAG"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

  publish:
    name: Attach verified downloads
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Validate downloads and generate checksums
        run: |
          python3 scripts/release/checksums.py dist "$RELEASE_TAG"
          cd dist
          sha256sum --check SHA256SUMS
      - name: Upload to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
