[package]
name = "focus-addon-support"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
[dependencies]
egui = { version = "=0.36.2", features = ["serde"] }
egui_commonmark = { version = "=0.25.0", default-features = false, features = ["pulldown_cmark", "better_syntax_highlighting", "load-images"] }
focus-addon-sdk = { path = "../addon-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
miniz_oxide = "0.8"
log = "0.4"
env_logger = "0.11"
regex = "1"
dirs = "6"
