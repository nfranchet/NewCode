[package]
name = "focus-editor"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
eframe = { version = "0.32", features = ["persistence"] }
portable-pty = "0.9"
unicode-width = "0.2"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
log = "0.4"
regex = "1"
env_logger = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
