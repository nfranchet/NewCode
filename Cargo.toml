[package]
name = "focus-editor"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["persistence", "default_fonts", "glow", "wayland", "x11", "accesskit"] }
portable-pty = "0.9"
egui_tty = "=0.2.0"
# Keep the widget on the verified Ghostty bindings and static-linking default.
libghostty-vt = "=0.2.2"
fontdb = "0.24"
ttf-parser = "0.25"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
log = "0.4"
regex = "1"
env_logger = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
